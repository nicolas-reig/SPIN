  <title id="title">SPIN compass — 50° perspective with raised details</title>
  <desc id="desc">The app's compass tilted 50 degrees about the X axis. The circular rim and cardinal triangles have subtle extrusion; the eight intermediate marks have less relief. The central N is flat on the face. Transparent background.</desc>
