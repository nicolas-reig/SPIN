  <title id="title">SPIN compass — 55° perspective with raised details</title>
  <desc id="desc">The app's compass tilted 55 degrees about the X axis. The circular rim and cardinal triangles have subtle extrusion; the eight intermediate marks have less relief. The central N is flat on the face. Transparent background.</desc>
